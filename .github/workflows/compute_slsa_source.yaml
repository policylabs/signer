---
name: SLSA Source
on:
  push:
    branches: [ "main" ]
    tags: ['**']
permissions: {}

jobs:
  # Whenever new source is pushed recompute the slsa source information.
  generate-provenance:
    permissions:
      contents: write # needed for storing the vsa in the repo.
      id-token: write # meeded to mint yokens for signing
    uses: slsa-framework/actions/.github/workflows/compute_slsa_source.yml@82f8f5380f0d5cbb27c9ef9c6a1553f616c10a13 # main
    with:
      allow-merge-commits: true
