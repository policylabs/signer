---
name: SLSA Source
on:
  push:
    branches: [ "main" ]
    tags: ['**']
permissions: {}

jobs:
  # Whenever new source is pushed recompute the slsa source information.
  generate-provenance:
    permissions:
      contents: write # needed for storing the vsa in the repo.
      id-token: write # meeded to mint yokens for signing
    uses: slsa-framework/actions/.github/workflows/compute_slsa_source.yml@fc8f9893abf2d0ad4add434936e0ef2c678c49fb # main
    with:
      allow-merge-commits: true
