name: refresh-roots

on:
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions: {}

env:
  REFRESH_BRANCH: automated/refresh-trusted-roots
  ISSUE_TITLE: "Refresh embedded sigstore roots"

jobs:
  refresh-roots:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the refresh branch
      issues: write    # open the issue asking admins to merge it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Refresh embedded trusted roots
        run: go run ./hack/refresh-roots

      - name: Verify refreshed roots are fresh
        env:
          SIGNER_CHECK_ROOT_FRESHNESS: "1"
        run: go test -v -run TestTrustedRootFreshness ./sigstore/

      - name: Commit refreshed roots
        id: commit
        run: |
          git add -- sigstore/sigstore-roots.json sigstore/roots/*.json
          if git diff --cached --quiet; then
            echo "Embedded roots are up to date; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh embedded sigstore roots"
          {
            echo "changed=true"
            echo "files<<EOF"
            git diff-tree --no-commit-id --name-only -r HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN is not allowed to open pull requests in this org
      # ("Allow GitHub Actions to create and approve pull requests" is
      # disabled), so the refreshed roots are pushed to a branch and an
      # issue points the admins at the compare view to open the PR.
      - name: Push refresh branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${REFRESH_BRANCH}"

      - name: Open or update the refresh issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FILES: ${{ steps.commit.outputs.files }}
        run: |
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${REFRESH_BRANCH}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit="$(git rev-parse HEAD)"
          today="$(date -u +%Y-%m-%d)"

          files_list="$(printf '%s\n' "${CHANGED_FILES}" | sed 's/^/- `/; s/$/`/')"

          body="$(cat <<MD
          The embedded sigstore trusted roots are out of date. The \`refresh-roots\`
          workflow re-fetched them and pushed the result to the
          \`${REFRESH_BRANCH}\` branch (last refreshed ${today}, commit ${commit}).

          **Open the pull request from the compare view:**
          ${compare_url}?expand=1

          Files changed:
          ${files_list}

          The workflow cannot open the PR itself because GitHub Actions is not
          permitted to create pull requests in this organization. It reruns weekly
          and force-pushes the branch with the latest roots until this is merged,
          so always review the current branch tip rather than this issue.

          Generated by [this workflow run](${run_url}), which runs
          \`go run ./hack/refresh-roots\` to re-fetch each instance's
          \`trusted_root.json\` over TUF, bump its \`trusted-root-snapshot\` in
          \`sigstore/sigstore-roots.json\`, and advance the embedded TUF bootstrap
          root in \`sigstore/roots/<id>.json\` to the newest root metadata that
          verifies from the current one.
          MD
          )"

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 200 \
            --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)"

          if [ -n "${existing}" ]; then
            echo "Issue #${existing} is already open; adding a comment with the refreshed branch."
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "$(cat <<MD
          Branch \`${REFRESH_BRANCH}\` was refreshed again on ${today} (commit ${commit}).
          Open the PR from ${compare_url}?expand=1 ([workflow run](${run_url})).
          MD
          )"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" --body "${body}"
          fi
